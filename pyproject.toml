[project]
name = "peekaboo"
version = "0.0.1"
description = "A voice assistant for your on-screen content"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[anthropic,cartesia,daily,deepgram,runner,silero,webrtc]>=1.8.1,<2",
]

[tool.uv.sources]
# Track the sibling checkout while the workers API settles. Switch back to a
# PyPI pin once the release we depend on is out.
pipecat-ai = { path = "../pipecat", editable = true }
