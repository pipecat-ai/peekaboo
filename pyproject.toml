[project]
name = "peekaboo"
version = "0.0.1"
description = "A voice assistant for your on-screen content"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Moonshine hears, Cartesia speaks by default; Kokoro speaks with
    # --local-speech, and Deepgram hears with --stt deepgram.
    "pipecat-ai[anthropic,cartesia,daily,deepgram,kokoro,moonshine,runner,silero,webrtc]>=1.8.1",
    # The macOS capture and audio layers. Marked so a Linux checkout still
    # resolves; nothing outside src/macos/ and spikes/ imports these.
    "pyobjc-framework-Cocoa>=11.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=11.0; sys_platform == 'darwin'",
    "pyobjc-framework-CoreMedia>=11.0; sys_platform == 'darwin'",
    "pyobjc-framework-ScreenCaptureKit>=11.0; sys_platform == 'darwin'",
    "pyobjc-framework-AVFoundation>=11.0; sys_platform == 'darwin'",
    "pyobjc-framework-WebKit>=11.0; sys_platform == 'darwin'",
]

# The sibling checkout, editable: Peekaboo tracks pipecat's main. `uv run`
# syncs the environment from the lock before every run, so a manual
# `uv pip install -e ../pipecat` did not survive; this does.
[tool.uv.sources]
pipecat-ai = { path = "../pipecat", editable = true }
