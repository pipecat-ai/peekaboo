# Text-mode scenario: drives the voice worker with typed turns and checks that
# questions are routed to the right tool. No judge needed: every assertion is
# deterministic. Run the bot with `uv run src/bot.py -t eval`, then
# `uv run evals/run.py evals/tool_routing.yaml`.
name: tool_routing
turns:
  # After a look or watch call the acknowledgement is a canned line spoken
  # without running the LLM again, so there is no llm_response to wait for; it
  # shows up in the runner's "spoken" list as "One moment." / "I'll let you
  # know." The target is what the user called the window, in their words, so
  # it is not asserted on.
  - user: "What does the terminal window say?"
    expect:
      - event: function_call
        calls:
          - name: look

  - user: "Tell me when the build finishes."
    expect:
      - event: function_call
        calls:
          - name: watch

  # Talking about the window goes to the ui worker, which answers on its own
  # (no llm_response from the voice LLM). Placed before the turns that speak
  # a real answer: a typed turn arriving mid-speech is an interruption.
  - user: "Open the first one."
    expect:
      - event: function_call
        calls:
          - name: window

  - user: "What was I working on in the last block at around three PM?"
    expect:
      - event: function_call
        calls:
          - name: window

  - user: "Show me the watchers."
    expect:
      - event: function_call
        calls:
          - name: window

  # Remembering an earlier question goes to the searches, not the screen.
  - user: "Yesterday I remember asking you about a pull request. What was it?"
    expect:
      - event: function_call
        calls:
          - name: past_searches
      - event: llm_response

  # General knowledge: answered directly, no tool. The absence check runs
  # after the answer and only holds the turn open for a short window.
  - user: "What is the capital of France?"
    expect:
      - event: llm_response
        text_contains: "Paris"
      - event: function_call
        absent: true
        within_ms: 3000
